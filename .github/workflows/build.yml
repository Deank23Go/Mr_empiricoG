name: Java CI with Gradle and SonarCloud

on:
  push:
    branches: [ "developer" ]
  pull_request:
    branches: [ "developer" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.1
        with:
          organization: deank23go
          token: ${{ secrets.SONAR_TOKEN }}

      - name: Build with Gradle Wrapper and analyze with SonarCloud
        run: bash ./gradlew clean build sonarqube \
          -Dsonar.projectKey=Deank23Go_Mr_empiricoG \
          -Dsonar.organization=deank23go \
          -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582
